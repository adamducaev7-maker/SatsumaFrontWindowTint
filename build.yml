name: Build Satsuma Front Window Tint

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild SatsumaFrontWindowTint.csproj /p:Configuration=Release /p:Platform=AnyCPU

      - name: Prepare mod
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item bin\Release\SatsumaFrontWindowTint.dll artifact\SatsumaFrontWindowTint.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SatsumaFrontWindowTint
          path: artifact\SatsumaFrontWindowTint.dll
