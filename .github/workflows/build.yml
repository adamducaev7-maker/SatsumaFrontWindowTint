name: Build Satsuma Front Window Tint

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore SatsumaFrontWindowTint.csproj

      - name: Build
        run: msbuild SatsumaFrontWindowTint.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:Restore=false

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SatsumaFrontWindowTint
          path: bin\Release\net472\SatsumaFrontWindowTint.dll
